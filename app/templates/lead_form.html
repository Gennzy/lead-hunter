{% extends "base.html" %}
{% block title %}Новый лид — Lead Hunter{% endblock %}
{% block content %}
<h1>Новый лид</h1>
<p class="subtitle">Добавьте лид вручную</p>

<div class="card" style="max-width:600px">
    <form method="post" action="/leads/new">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-grid">
            <div class="form-group"><label>Имя</label><input type="text" name="first_name" placeholder="Иван"></div>
            <div class="form-group"><label>Фамилия</label><input type="text" name="last_name" placeholder="Иванов"></div>
        </div>
        <div class="form-grid">
            <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="ivanov"></div>
            <div class="form-group"><label>Телефон</label><input type="text" name="phone" placeholder="+79001234567"></div>
        </div>
        <div class="form-group">
            <label>Сообщение <span style="color:var(--danger)">*</span></label>
            <textarea name="message_text" rows="4" placeholder="Текст сообщения клиента..." required></textarea>
        </div>
        <div class="form-grid">
            <div class="form-group"><label>Источник / Чат</label><input type="text" name="chat_title" placeholder="ЖК Чистое Небо"></div>
            <div class="form-group">
                <label>Приоритет</label>
                <select name="urgency">
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                </select>
            </div>
        </div>
        <div class="form-grid">
            <div class="form-group"><label>Lead Score</label><input type="number" name="lead_score" value="80" min="0" max="100"></div>
            <div class="form-group"></div>
        </div>
        <div class="form-group"><label>Причина</label><input type="text" name="reason" placeholder="Почему это лид?"></div>
        <div class="form-group"><label>Рекомендуемое сообщение</label><textarea name="recommended_message" rows="3" placeholder="Текст для отправки клиенту..."></textarea></div>
        <div class="form-actions">
            <a href="/leads" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Добавить лид</button>
        </div>
    </form>
</div>
{% endblock %}
