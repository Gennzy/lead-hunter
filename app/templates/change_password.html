<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — Lead Hunter</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            --primary: {{ theme_color|default('#7c5832') }};
            --primary-dark: color-mix(in srgb, var(--primary) 80%, black);
            --primary-light: color-mix(in srgb, var(--primary) 60%, white);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f2ef;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
        .wrap{display:flex;width:100%;min-height:100vh}
        .left{flex:1;background:linear-gradient(135deg,var(--primary-light) 0%,var(--primary) 50%,var(--primary-dark) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;position:relative;overflow:hidden}
        .left::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 60%);animation:shimmer 10s ease-in-out infinite}
        @keyframes shimmer{0%,100%{transform:translateX(-20%) translateY(-20%)}50%{transform:translateX(20%) translateY(20%)}}
        .brand{position:relative;z-index:1;text-align:center;color:#fff}
        .brand svg{width:72px;height:72px;margin-bottom:20px;opacity:.9}
        .brand h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
        .brand p{font-size:15px;opacity:.75;font-weight:400}
        .right{flex:1;display:flex;align-items:center;justify-content:center;padding:48px;background:#f4f2ef}
        .card{width:100%;max-width:360px}
        .card h2{font-size:24px;font-weight:700;color:#1c1917;letter-spacing:-.3px;margin-bottom:4px}
        .card .sub{font-size:13.5px;color:#a8a29e;margin-bottom:32px}
        .fg{margin-bottom:18px}
        .fg label{display:block;font-size:12.5px;font-weight:600;color:#57534e;margin-bottom:6px}
        .fg input{width:100%;padding:10px 14px;border:1px solid #e2dfd9;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#1c1917;transition:all .15s ease}
        .fg input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent)}
        .fg input::placeholder{color:#c4b8a8}
        .btn-login{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s ease;letter-spacing:.2px}
        .btn-login:hover{background:var(--primary-dark);box-shadow:0 4px 16px color-mix(in srgb, var(--primary) 30%, transparent)}
        .btn-login:active{transform:scale(.98)}
        .error{background:#fef2f2;color:#dc2626;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:18px;border:1px solid #fecaca}
        .warning{background:#fefce8;color:#a16207;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:18px;border:1px solid #fde68a}
        @media(max-width:768px){.left{display:none}.right{padding:32px 20px}}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="left">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="12" cy="12" r="8"/>
                    <circle cx="12" cy="12" r="2"/>
                    <line x1="12" y1="2" x2="12" y2="6"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="6" y2="12"/>
                    <line x1="18" y1="12" x2="22" y2="12"/>
                </svg>
                <h1>Lead Hunter</h1>
                <p>CRM для работы с лидами на ремонт</p>
            </div>
        </div>
        <div class="right">
            <div class="card">
                <h2>Смена пароля</h2>
                <p class="sub">Для безопасности необходимо изменить пароль</p>
                {% if must_change %}
                <div class="warning">Это ваш первый вход. Пожалуйста, задайте новый пароль.</div>
                {% endif %}
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                <form method="post" action="/change-password">
                    <div class="fg">
                        <label for="new_password">Новый пароль</label>
                        <input type="password" id="new_password" name="new_password" required minlength="8" placeholder="Не менее 8 символов">
                    </div>
                    <div class="fg">
                        <label for="confirm_password">Подтвердите пароль</label>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Повторите пароль">
                    </div>
                    <button type="submit" class="btn-login">Сохранить пароль</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
